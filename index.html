.card{

.menu{

.menu button{

#tabs button{

/* LOGIN / SIGNUP / LOGOUT (igual ao teu) */

async function login() {

async function signup() {
  const email = document.getElementById("email").value;

async function logout() {

   html += `

>

Valor: ${grupo.valor} Kz

<br>

<span id="membros-${grupo.id}">

/* FILTRO */

async function filtrar(tipo) {

  const grupos = document.querySelectorAll(".grupo-card");

  if (tipo === "Meus") {

    const { data: meusGrupos } = await client
      .from("group_members")
      .select("group_id")
      .eq("user_id", currentUser.id);

    const ids = meusGrupos.map(g => String(g.group_id));

    grupos.forEach(g => {

      const idGrupo = g.dataset.id;

      if (ids.includes(idGrupo)) {
        g.style.display = "block";
      } else {
        g.style.display = "none";
      }

    });

    return;
  }

  grupos.forEach(g => {

    if (
  g.dataset.tipo.toLowerCase() ===
  tipo.toLowerCase()
) {
      g.style.display = "block";
    } else {
      g.style.display = "none";
    }

  });

}

/* NAV */

function mostrarPagina(pagina) {

  document.getElementById("paginaInicio").style.display = "none";
  document.getElementById("paginaGrupos").style.display = "none";
  document.getElementById("paginaHistorico").style.display = "none";
  document.getElementById("paginaPerfil").style.display = "none";

  document.getElementById("pagina" + pagina.charAt(0).toUpperCase() + pagina.slice(1)).style.display = "block";
}

  async function depositarValor() {
  const valor = Number(document.getElementById("valorDeposito").value);

  if (!valor || valor <= 0) {
    alert("Valor inválido");
    return;
  }

  const { data: profile } = await client
    .from('profiles')
    .select('*')
    .eq('id', currentUser.id)
    .single();

  const saldoAtual = Number(profile.saldo || 0);
  const novoSaldo = saldoAtual + valor;

  // atualizar saldo
  const { error } = await client
    .from('profiles')
    .update({ saldo: novoSaldo })
    .eq('id', currentUser.id);

  if (error) {
    alert(error.message);
    return;
  }

  // 📌 REGISTAR HISTÓRICO
  await client.from("transactions").insert({
    user_id: currentUser.id,
    tipo: "deposito",
    valor: valor
  });

  document.getElementById("userSaldo").innerText = novoSaldo + " Kz";

  alert("Depósito feito com sucesso!");
  }

  async function salvarNome() {

  const nome = document.getElementById("inputNome").value;

  const { error } = await client
    .from('profiles')
    .update({ nome })
    .eq('id', currentUser.id);

  if (error) {
    alert(error.message);
    return;
  }

  document.getElementById("perfilNome").innerText = nome;
  alert("Nome atualizado!");
  }

await client

  async function carregarHistorico() {

  const { data } = await client
    .from("transactions")
    .select("*")
    .eq("user_id", currentUser.id)
    .order("created_at", { ascending: false });

  let html = "";

  for (const t of data) {

    let cor = "black";
    if (t.tipo === "deposito") cor = "green";
    if (t.tipo === "saida_grupo") cor = "red";

    html += `
      <div class="card">
        <b style="color:${cor}">
          ${t.tipo}
        </b><br>
        ${t.valor} Kz<br>
        <small>${new Date(t.created_at).toLocaleString()}</small>
      </div>
    `;
  }

  document.getElementById("historico").innerHTML =
    html || "Nenhuma transação.";
  }
  
verificarSessao();
