<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>KixApp Login</title>

  <style>

body{
  margin:0;
  padding:0;
  background:#f4f6f8;
  font-family:Arial,sans-serif;
}

#app{
  padding:15px;
  padding-bottom:80px;
}

.topbar{
  background:white;
  padding:15px;
  border-radius:12px;
  margin-bottom:15px;
  box-shadow:0 2px 8px rgba(0,0,0,0.08);
}

.card{
  background:white;
  padding:15px;
  border-radius:12px;
  margin-bottom:15px;
  box-shadow:0 2px 8px rgba(0,0,0,0.08);
}

.saldo{
  font-size:30px;
  font-weight:bold;
  color:#1e3a8a;
}

.input{
  width:100%;
  padding:12px;
  box-sizing:border-box;
  border:1px solid #ddd;
  border-radius:8px;
}

.btn{
  width:100%;
  padding:12px;
  border:none;
  border-radius:8px;
  background:#1e3a8a;
  color:white;
  margin-top:10px;
}

.grupo{
  border:1px solid #ddd;
  border-radius:10px;
  padding:12px;
  margin-top:10px;
}

.menu{
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  background:white;
  display:flex;
  justify-content:space-around;
  padding:10px;
  border-top:1px solid #ddd;
}

.menu button{
  border:none;
  background:none;
  font-size:14px;
}

  </style>
</head>

<body>

<div id="loginBox">

  <h2>Login KixApp</h2>

  <input id="email" placeholder="Email">
  <br><br>

  <input id="password" type="password" placeholder="Senha">
  <br><br>

  <button onclick="login()">Entrar</button>
  <button onclick="signup()">Criar conta</button>

  <p id="msg"></p>

</div>

<!-- APP -->
<div id="app" style="display:none;">

  <div class="topbar">
    <h2>KixApp</h2>
  </div>

  <!-- INÍCIO -->
  <div id="paginaInicio">

    <div class="card">
      <h3>Conta</h3>
      <p id="userEmail"></p>
    </div>

    <div class="card">
      <h3>Saldo Disponível</h3>

      <div class="saldo" id="userSaldo">
        0 Kz
      </div>

      <br>

      <input
        class="input"
        id="valorDeposito"
        type="number"
        placeholder="Digite o valor">

      <button
        class="btn"
        onclick="depositarValor()">
        Adicionar saldo
      </button>

    </div>

  </div>

  <!-- GRUPOS -->
  <div id="paginaGrupos" style="display:none;">

    <div class="card">
      <h3>Grupos Kixikila</h3>

      <div id="listaGrupos">
        Carregando grupos...
      </div>

    </div>

  </div>

  <!-- HISTÓRICO -->
  <div id="paginaHistorico" style="display:none;">

    <div class="card">
      <h3>Histórico</h3>

      <div id="historico">
        Nenhuma transação.
      </div>

    </div>

  </div>

  <!-- PERFIL -->
  <div id="paginaPerfil" style="display:none;">

    <div class="card">
      <h3>Perfil</h3>

      <p id="perfilEmail"></p>

      <p>
        Plano:
        <span id="perfilPlano">
          Basic
        </span>
      </p>

      <button
        class="btn"
        onclick="logout()">
        Terminar sessão
      </button>

    </div>

  </div>

  <div class="menu">

    <button onclick="mostrarPagina('inicio')">
      Início
    </button>

    <button onclick="mostrarPagina('grupos')">
      Grupos
    </button>

    <button onclick="mostrarPagina('historico')">
      Histórico
    </button>

    <button onclick="mostrarPagina('perfil')">
      Perfil
    </button>

  </div>

</div>
  
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const client = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  let currentUser = null;
  
async function login() {
  const email = document.getElementById("email").value;
  const password = document.getElementById("password").value;

  const { data, error } = await client.auth.signInWithPassword({
    email,
    password
  });

  if (error) {
    document.getElementById("msg").innerText = error.message;
    return;
  }

  const user = data.user;

  currentUser = user;

  // garantir perfil existe
  await client.from('profiles').upsert({
    id: user.id,
    email: user.email
  });

  // buscar perfil atualizado
  const { data: profile } = await client
    .from('profiles')
    .select('*')
    .eq('id', user.id)
    .single();

  document.getElementById("loginBox").style.display = "none";
  document.getElementById("app").style.display = "block";

  document.getElementById("userEmail").innerText =
    "👤 " + profile.email;

  document.getElementById("perfilEmail").innerText =
  profile.email;

document.getElementById("perfilPlano").innerText =
  profile.plano || "basic";

  document.getElementById("userSaldo").innerText =
    profile.saldo + " Kz";
  
await carregarGrupos();
}

async function signup() {
  const email = document.getElementById("email").value;
  const password = document.getElementById("password").value;

  const { error } = await client.auth.signUp({
    email,
    password
  });

  if (error) {
    document.getElementById("msg").innerText = error.message;
    return;
  }

  document.getElementById("msg").innerText =
    "Conta criada! Agora faz login.";
}

async function logout() {
  await client.auth.signOut();
  location.reload();
}

  async function depositar(valor) {

  const { data: profile } = await client
    .from('profiles')
    .select('*')
    .eq('id', currentUser.id)
    .single();

  const novoSaldo = Number(profile.saldo || 0) + valor;

  const { error } = await client
  .from('profiles')
  .update({
    saldo: novoSaldo
  })
  .eq('id', currentUser.id);

if (error) {
  alert(error.message);
  return;
}

  await client
    .from('transactions')
    .insert({
      user_id: currentUser.id,
      tipo: 'deposito',
      valor: valor
    });

  document.getElementById("userSaldo").innerText =
    novoSaldo + " Kz";
  }

  async function verificarSessao() {

  const { data } = await client.auth.getSession();

  if (!data.session) return;

  const user = data.session.user;

  currentUser = user;

  const { data: profile } = await client
    .from('profiles')
    .select('*')
    .eq('id', user.id)
    .single();

  document.getElementById("loginBox").style.display = "none";
  document.getElementById("app").style.display = "block";

  document.getElementById("userEmail").innerText =
    "👤 " + profile.email;
    
document.getElementById("perfilEmail").innerText =
  profile.email;

document.getElementById("perfilPlano").innerText =
  profile.plano || "basic";
    
  document.getElementById("userSaldo").innerText =
  Number(profile.saldo || 0) + " Kz";
  
  await carregarGrupos();
  }

  async function depositarValor() {

  const valor = Number(
    document.getElementById("valorDeposito").value
  );

  if (!valor || valor <= 0) {
    alert("Digite um valor válido");
    return;
  }

  await depositar(valor);

  document.getElementById("valorDeposito").value = "";
  }

    async function carregarGrupos() {

  const { data: grupos, error } = await client
    .from('groups')
    .select('*')
    .order('valor');

  if (error) {
    alert(error.message);
    return;
  }

  let html = '';

  grupos.forEach(grupo => {

    html += `
      <div style="
        border:1px solid #ddd;
        padding:10px;
        margin-top:10px;
        border-radius:8px;
      ">
        <b>${grupo.nome}</b><br>
        Valor: ${grupo.valor} Kz

        <br><br>

        <button onclick="entrarGrupo(${grupo.id})">
          Entrar
        </button>

      </div>
    `;
  });

  document.getElementById('listaGrupos').innerHTML = html;
    }

  async function entrarGrupo(groupId) {

  const { error } = await client
    .from('group_members')
    .insert({
      group_id: groupId,
      user_id: currentUser.id
    });

  if (error) {
    alert(error.message);
    return;
  }

  alert('Entraste no grupo com sucesso!');
  }

  function mostrarPagina(pagina) {

  document.getElementById("paginaInicio").style.display = "none";
  document.getElementById("paginaGrupos").style.display = "none";
  document.getElementById("paginaHistorico").style.display = "none";
  document.getElementById("paginaPerfil").style.display = "none";

  if (pagina === "inicio") {
    document.getElementById("paginaInicio").style.display = "block";
  }

  if (pagina === "grupos") {
    document.getElementById("paginaGrupos").style.display = "block";
  }

  if (pagina === "historico") {
    document.getElementById("paginaHistorico").style.display = "block";
  }

  if (pagina === "perfil") {
    document.getElementById("paginaPerfil").style.display = "block";
  }
  }

  verificarSessao();
</script>

</body>
</html>
