<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>KixApp Login</title>
</head>
<body>

<h2>Login KixApp</h2>

<input id="email" placeholder="email" />
<br><br>

<input id="password" type="password" placeholder="password" />
<br><br>

<button onclick="login()">Entrar</button>

  <div id="app" style="display:none;">

  <h1>KixApp</h1>

  <p id="userEmail"></p>

  <button onclick="logout()">Terminar sessão</button>

  </div>

  <button onclick="signup()">Criar conta</button>

<p id="msg"></p>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
const SUPABASE_URL = "https://sksrqwtzwibrrijfpqcy.supabase.co"; 
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNrc3Jxd3R6d2licnJpamZwcWN5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODE1NjIwNzYsImV4cCI6MjA5NzEzODA3Nn0.UO6_GSuLxFaXTAuI8jdby2I1ZncxZVguFqMUcW8NOpE";

const client = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

async function login() {
  const email = document.getElementById("email").value;
  const password = document.getElementById("password").value;

  const { data, error } = await client.auth.signInWithPassword({
    email,
    password
  });

  if (error) {
    document.getElementById("msg").innerText = error.message;
    return;
  }

  const user = data.user;

  await client.from('profiles').upsert({
    id: user.id,
    email: user.email
  });

  document.getElementById("userEmail").innerText =
  "Utilizador: " + user.email;

document.getElementById("app").style.display = "block";
  document.getElementById("email").style.display = "none";
document.getElementById("password").style.display = "none";
}
  
  async function signup() {
  const email = document.getElementById("email").value;
  const password = document.getElementById("password").value;

  const { data, error } = await client.auth.signUp({
    email,
    password
  });

  if (error) {
    document.getElementById("msg").innerText = error.message;
    return;
  }

  document.getElementById("msg").innerText = "Conta criada! Agora faz login.";
  }

  async function logout() {
  await client.auth.signOut();
  location.reload();
  }
</script>
  
</body>
</html>
