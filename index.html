async function signup() {

  async function depositar(valor) {

    .from('profiles')
    .select('*')
    .eq('id', currentUser.id)
    .single();

  .from('profiles')
  .update({
    saldo: novoSaldo

  .eq('id', currentUser.id);

  async function verificarSessao() {

    .from('profiles')
    .select('*')
    .eq('id', user.id)

  );

  document.getElementById("valorDeposito").value = "";
