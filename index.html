<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>KixApp Login</title>
</head>

<body>

<div id="loginBox">

  <h2>Login KixApp</h2>

  <input id="email" placeholder="Email">
  <br><br>

  <input id="password" type="password" placeholder="Senha">
  <br><br>

  <button onclick="login()">Entrar</button>
  <button onclick="signup()">Criar conta</button>

  <p id="msg"></p>

</div>

<!-- APP -->
<div id="app" style="display:none;">

  <h1>📱 KixApp</h1>

  <div style="background:#e9e9e9;padding:15px;border-radius:10px;margin-top:10px;">
    <h3>👤 Perfil</h3>
    <p id="userEmail"></p>
  </div>

  <div style="background:#dff0ff;padding:15px;border-radius:10px;margin-top:10px;">
    <h3>💰 Carteira</h3>
    <p id="userSaldo">0 Kz</p>
  </div>

  <div style="background:#f7f7f7;padding:15px;border-radius:10px;margin-top:10px;">
    <h3>📜 Histórico</h3>
    <p>Nenhuma transação.</p>
  </div>

  <div style="background:#f7f7f7;padding:15px;border-radius:10px;margin-top:10px;">
    <h3>⚙️ Configurações</h3>
    <p>Em desenvolvimento.</p>
  </div>

  <br>

  <button onclick="logout()">🚪 Terminar sessão</button>

</div>
  
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
const SUPABASE_URL = "https://sksrqwtzwibrrijfpqcy.supabase.co"; 
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNrc3Jxd3R6d2licnJpamZwcWN5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODE1NjIwNzYsImV4cCI6MjA5NzEzODA3Nn0.UO6_GSuLxFaXTAuI8jdby2I1ZncxZVguFqMUcW8NOpE";

const client = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

async function login() {
  const email = document.getElementById("email").value;
  const password = document.getElementById("password").value;

  const { data, error } = await client.auth.signInWithPassword({
    email,
    password
  });

  if (error) {
    document.getElementById("msg").innerText = error.message;
    return;
  }

  const user = data.user;

  // garantir perfil existe
  await client.from('profiles').upsert({
    id: user.id,
    email: user.email
  });

  // buscar perfil atualizado
  const { data: profile } = await client
    .from('profiles')
    .select('*')
    .eq('id', user.id)
    .single();

  document.getElementById("loginBox").style.display = "none";
  document.getElementById("app").style.display = "block";

  document.getElementById("userEmail").innerText =
    "👤 " + profile.email;

  document.getElementById("userSaldo").innerText =
    profile.saldo + " Kz";
}

async function signup() {
  const email = document.getElementById("email").value;
  const password = document.getElementById("password").value;

  const { error } = await client.auth.signUp({
    email,
    password
  });

  if (error) {
    document.getElementById("msg").innerText = error.message;
    return;
  }

  document.getElementById("msg").innerText =
    "Conta criada! Agora faz login.";
}

async function logout() {
  await client.auth.signOut();
  location.reload();
}
</script>

</body>
</html>
