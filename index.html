<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>KixApp Login</title>

  <style>

body{
  margin:0;
  padding:0;
  background:#f4f6f8;
  font-family:Arial,sans-serif;
}

#app{
  padding:15px;
  padding-bottom:80px;
}

.topbar{
  background:white;
  padding:15px;
  border-radius:12px;
  margin-bottom:15px;
  box-shadow:0 2px 8px rgba(0,0,0,0.08);
}

.card{
  background:white;
  padding:15px;
  border-radius:12px;
  margin-bottom:15px;
  box-shadow:0 2px 8px rgba(0,0,0,0.08);
}

.saldo{
  font-size:30px;
  font-weight:bold;
  color:#1e3a8a;
}

.input{
  width:100%;
  padding:12px;
  box-sizing:border-box;
  border:1px solid #ddd;
  border-radius:8px;
}

.btn{
  width:100%;
  padding:12px;
  border:none;
  border-radius:8px;
  background:#1e3a8a;
  color:white;
  margin-top:10px;
}

.grupo-card{
  border:1px solid #ddd;
  padding:12px;
  margin-top:10px;
  border-radius:10px;
  background:white;
}

.menu{
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  background:white;
  display:flex;
  justify-content:space-around;
  padding:10px;
  border-top:1px solid #ddd;
}

.menu button{
  border:none;
  background:none;
  font-size:14px;
}

#tabs button{
  margin-right:5px;
  padding:6px 10px;
  border-radius:6px;
  border:1px solid #ddd;
  background:white;
}

  </style>
</head>

<body>

<div id="loginBox">

  <h2>Login KixApp</h2>

  <input id="email" placeholder="Email">
  <br><br>

  <input id="password" type="password" placeholder="Senha">
  <br><br>

  <button onclick="login()">Entrar</button>
  <button onclick="signup()">Criar conta</button>

  <p id="msg"></p>

</div>

<!-- APP -->
<div id="app" style="display:none;">

  <div class="topbar">
    <h2>KixApp</h2>
  </div>

  <!-- INÍCIO -->
  <div id="paginaInicio">

    <div class="card">
      <h3>Conta</h3>
      <p id="userEmail"></p>
    </div>

    <div class="card">
      <h3>Saldo Disponível</h3>

      <div class="saldo" id="userSaldo">0 Kz</div>

      <br>

      <input class="input" id="valorDeposito" type="number" placeholder="Digite o valor">

      <button class="btn" onclick="depositarValor()">Adicionar saldo</button>

    </div>

  </div>

  <!-- GRUPOS -->
  <div id="paginaGrupos" style="display:none;">

    <div class="card">
      <h3>Grupos Kixikila</h3>

      <div id="tabs">
        <button onclick="filtrar('Todos')">Todos</button>
        <button onclick="filtrar('Semanal')">Semanal</button>
        <button onclick="filtrar('Mensal')">Mensal</button>
        <button onclick="filtrar('Trimestral')">Trimestral</button>
      </div>

      <div id="listaGrupos">
        Carregando grupos...
      </div>

    </div>

  </div>

  <!-- HISTÓRICO -->
  <div id="paginaHistorico" style="display:none;">

    <div class="card">
      <h3>Histórico</h3>

      <div id="historico">
        Nenhuma transação.
      </div>

    </div>

  </div>

  <!-- PERFIL -->
  <div id="paginaPerfil" style="display:none;">

    <div class="card">
      <h3>Perfil</h3>

      <input id="inputNome" placeholder="Seu nome">
<button onclick="salvarNome()">Salvar nome</button>

<p id="perfilNome"></p>

      <p>
        Plano:
        <span id="perfilPlano">Basic</span>
      </p>

      <div class="card">

  <h3>💎 Plano Atual</h3>

  <p>Plano: <span id="planoAtual">Basic</span></p>

  <p>
    Grupos usados:
    <span id="gruposUsados">0</span> /
    <span id="gruposLimite">3</span>
  </p>

  <p>Status: 🔵 Ativo</p>

      </div>

      <button class="btn" onclick="logout()">Terminar sessão</button>

    </div>

  </div>

  <div class="menu">

    <button onclick="mostrarPagina('inicio')">Início</button>
    <button onclick="mostrarPagina('grupos')">Grupos</button>
    <button onclick="mostrarPagina('historico')">Histórico</button>
    <button onclick="mostrarPagina('perfil')">Perfil</button>

  </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
const SUPABASE_URL = "https://sksrqwtzwibrrijfpqcy.supabase.co"; 
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNrc3Jxd3R6d2licnJpamZwcWN5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODE1NjIwNzYsImV4cCI6MjA5NzEzODA3Nn0.UO6_GSuLxFaXTAuI8jdby2I1ZncxZVguFqMUcW8NOpE";

const client = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

let currentUser = null;

  let planoAtual = "Basic";
let gruposUsados = 0;

const limitesPlano = {
  Basic: 3,
  Pro: 10,
  Premium: 999
};

/* LOGIN / SIGNUP / LOGOUT (igual ao teu) */

async function login() {
  const email = document.getElementById("email").value;
  const password = document.getElementById("password").value;

  const { data, error } = await client.auth.signInWithPassword({
    email,
    password
  });

  if (error) {
    alert(error.message);
    return;
  }

  currentUser = data.user;

  const { data: profile } = await client
    .from('profiles')
    .select('*')
    .eq('id', currentUser.id)
    .single();

  document.getElementById("loginBox").style.display = "none";
  document.getElementById("app").style.display = "block";

  document.getElementById("userEmail").innerText =
    "👤 " + currentUser.email;

  document.getElementById("perfilNome").innerText =
    profile.nome || "Sem nome";

  document.getElementById("userSaldo").innerText =
    (profile.saldo || 0) + " Kz";

  await carregarGrupos();
}

async function signup() {
  const email = document.getElementById("email").value;
  const password = document.getElementById("password").value;

  await client.auth.signUp({ email, password });
}

async function logout() {
  await client.auth.signOut();
  location.reload();
}

/* GRUPOS */

async function carregarGrupos() {

  const { data: grupos } = await client
    .from('groups')
    .select('*')
    .order('valor');

  let html = '';

  grupos.forEach(grupo => {

    html += `
      <div class="grupo-card" data-tipo="${grupo.tipo || 'Semanal'}">

        <b>${grupo.nome}</b><br>
        Valor: ${grupo.valor} Kz

        <br><br>

        <button onclick="entrarGrupo(${grupo.id})">
          Entrar
        </button>

      </div>
    `;
  });

  document.getElementById('listaGrupos').innerHTML = html;

  filtrar("Semanal");
}

/* ENTRAR GRUPO */

async function entrarGrupo(groupId) {

  if (gruposUsados >= limitesPlano[planoAtual]) {
    alert("❌ Limite do plano atingido");
    return;
  }

  const { error } = await client
    .from('group_members')
    .insert({
      group_id: groupId,
      user_id: currentUser.id
    });

  if (error) {
    alert(error.message);
    return;
  }

  gruposUsados++;

  document.getElementById("gruposUsados").innerText =
    gruposUsados;

  alert("✔ Entraste no grupo!");
}

/* FILTRO */

function filtrar(tipo) {
  const grupos = document.querySelectorAll(".grupo-card");

  grupos.forEach(g => {
    if (tipo === "Todos" || g.dataset.tipo === tipo) {
      g.style.display = "block";
    } else {
      g.style.display = "none";
    }
  });
}

/* NAV */

function mostrarPagina(pagina) {

  document.getElementById("paginaInicio").style.display = "none";
  document.getElementById("paginaGrupos").style.display = "none";
  document.getElementById("paginaHistorico").style.display = "none";
  document.getElementById("paginaPerfil").style.display = "none";

  document.getElementById("pagina" + pagina.charAt(0).toUpperCase() + pagina.slice(1)).style.display = "block";
}

  async function depositar(valor) {

  if (!currentUser) {
    alert("Utilizador não autenticado");
    return;
  }

  const { data: profile } = await client
    .from('profiles')
    .select('*')
    .eq('id', currentUser.id)
    .single();

  const saldoAtual = Number(profile.saldo || 0);
  const novoSaldo = saldoAtual + Number(valor);

  const { error } = await client
    .from('profiles')
    .update({ saldo: novoSaldo })
    .eq('id', currentUser.id);

  if (error) {
    alert(error.message);
    return;
  }

  document.getElementById("userSaldo").innerText = novoSaldo + " Kz";
  }

  async function salvarNome() {

  const nome = document.getElementById("inputNome").value;

  const { error } = await client
    .from('profiles')
    .update({ nome })
    .eq('id', currentUser.id);

  if (error) {
    alert(error.message);
    return;
  }

  document.getElementById("perfilNome").innerText = nome;
  alert("Nome atualizado!");
  }

    async function verificarSessao() {

  const { data } = await client.auth.getSession();

  if (!data.session) return;

  currentUser = data.session.user;

  const { data: profile } = await client
    .from('profiles')
    .select('*')
    .eq('id', currentUser.id)
    .single();

  document.getElementById("loginBox").style.display = "none";
  document.getElementById("app").style.display = "block";

  document.getElementById("userEmail").innerText =
    "👤 " + currentUser.email;

  document.getElementById("perfilNome").innerText =
    profile.nome || "Sem nome";

  document.getElementById("userSaldo").innerText =
    (profile.saldo || 0) + " Kz";

  await carregarGrupos();
  }
  
verificarSessao();
</script>

</body>
</html>
