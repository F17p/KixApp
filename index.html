<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>KixApp Login</title>

  <style>

body{
  margin:0;
  padding:0;
  background:#f4f6f8;
  font-family:Arial,sans-serif;
}

#app{
  padding:15px;
  padding-bottom:80px;
}

.topbar{
  background:white;
  padding:15px;
  border-radius:12px;
  margin-bottom:15px;
  box-shadow:0 2px 8px rgba(0,0,0,0.08);
}

.card{
  background:white;
  padding:15px;
  border-radius:12px;
  margin-bottom:15px;
  box-shadow:0 2px 8px rgba(0,0,0,0.08);
}

.saldo{
  font-size:30px;
  font-weight:bold;
  color:#1e3a8a;
}

.input{
  width:100%;
  padding:12px;
  box-sizing:border-box;
  border:1px solid #ddd;
  border-radius:8px;
}

.btn{
  width:100%;
  padding:12px;
  border:none;
  border-radius:8px;
  background:#1e3a8a;
  color:white;
  margin-top:10px;
}

.grupo-card{
  border:1px solid #ddd;
  padding:12px;
  margin-top:10px;
  border-radius:10px;
  background:white;
}

.menu{
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  background:white;
  display:flex;
  justify-content:space-around;
  padding:10px;
  border-top:1px solid #ddd;
}

.menu button{
  border:none;
  background:none;
  font-size:14px;
}

#tabs button{
  margin-right:5px;
  padding:6px 10px;
  border-radius:6px;
  border:1px solid #ddd;
  background:white;
}

  </style>
</head>

<body>

<div id="loginBox">

  <h2>Login KixApp</h2>

  <input id="email" placeholder="Email">
  <br><br>

  <input id="password" type="password" placeholder="Senha">
  <br><br>

  <button onclick="login()">Entrar</button>
  <button onclick="signup()">Criar conta</button>

  <p id="msg"></p>

</div>

<!-- APP -->
<div id="app" style="display:none;">

  <div class="topbar">
    <h2>KixApp</h2>
  </div>

  <!-- INÍCIO -->
  <div id="paginaInicio">

    <div class="card">
      <h3>Conta</h3>
      <p id="userEmail"></p>
    </div>

    <div class="card">
      <h3>Saldo Disponível</h3>

      <div class="saldo" id="userSaldo">0 Kz</div>

      <br>

      <input class="input" id="valorDeposito" type="number" placeholder="Digite o valor">

      <button class="btn" onclick="depositarValor()">Adicionar saldo</button>

    </div>

  </div>

  <!-- GRUPOS -->
  <div id="paginaGrupos" style="display:none;">

    <div class="card">
      <h3>Grupos Kixikila</h3>

      <div id="tabs">
        <button onclick="filtrar('Meus')">Meus Grupos</button>
        <button onclick="filtrar('Semanal')">Semanal</button>
        <button onclick="filtrar('Mensal')">Mensal</button>
        <button onclick="filtrar('Trimestral')">Trimestral</button>
      </div>

      <div id="listaGrupos">
        Carregando grupos...
      </div>

    </div>

  </div>

  <!-- HISTÓRICO -->
  <div id="paginaHistorico" style="display:none;">

    <div class="card">
      <h3>Histórico</h3>

      <div id="historico">
        Nenhuma transação.
      </div>

    </div>

  </div>

  <!-- PERFIL -->
  <div id="paginaPerfil" style="display:none;">

    <div class="card">
      <h3>Perfil</h3>

      <input id="inputNome" placeholder="Seu nome">
<button onclick="salvarNome()">Salvar nome</button>

<p id="perfilNome"></p>

      <p>
        Plano:
        <span id="perfilPlano">Basic</span>
      </p>

      <div class="card">

  <h3>💎 Plano Atual</h3>

  <p>Plano: <span id="planoAtual">Basic</span></p>

  <p>
    Grupos usados:
    <span id="gruposUsados">0</span> /
    <span id="gruposLimite">3</span>
  </p>

  <p>Status: 🔵 Ativo</p>

      </div>

      <button class="btn" onclick="logout()">Terminar sessão</button>

    </div>

  </div>

  <div class="menu">

    <button onclick="mostrarPagina('inicio')">Início</button>
    <button onclick="mostrarPagina('grupos')">Grupos</button>
    <button onclick="mostrarPagina('historico')">Histórico</button>
    <button onclick="mostrarPagina('perfil')">Perfil</button>

  </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
  console.log("KixApp JS carregou");
  
const SUPABASE_URL = "https://sksrqwtzwibrrijfpqcy.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNrc3Jxd3R6d2licnJpamZwcWN5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODE1NjIwNzYsImV4cCI6MjA5NzEzODA3Nn0.UO6_GSuLxFaXTAuI8jdby2I1ZncxZVguFqMUcW8NOpE";

const client = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

let currentUser = null;
let planoAtual = "Basic";
let gruposUsados = 0;

const limitesPlano = {
  Basic: 3,
  Pro: 10,
  Premium: 999
};

/* LOGIN */
async function login() {
  const email = document.getElementById("email").value;
  const password = document.getElementById("password").value;

  const { data, error } = await client.auth.signInWithPassword({
    email,
    password
  });

  if (error) return alert(error.message);

  currentUser = data.user;

  const { data: profile } = await client
    .from("profiles")
    .select("*")
    .eq("id", currentUser.id)
    .single();

  document.getElementById("loginBox").style.display = "none";
  document.getElementById("app").style.display = "block";

  planoAtual = profile.plano || "Basic";
  gruposUsados = profile.grupos_usados || 0;

  document.getElementById("userEmail").innerText =
    "👤 " + (profile.nome || currentUser.email);

  document.getElementById("perfilNome").innerText = profile.nome || "Sem nome";
  document.getElementById("userSaldo").innerText = (profile.saldo || 0) + " Kz";

  await carregarGrupos();
  await carregarHistorico();
}

/* GRUPOS */
async function carregarGrupos() {
  const { data: grupos } = await client
    .from("groups")
    .select("*")
    .order("valor");

  let html = "";

  for (const grupo of grupos) {

    const { data: membro } = await client
      .from("group_members")
      .select("*")
      .eq("group_id", grupo.id)
      .eq("user_id", currentUser.id);

    const { count } = await client
      .from("group_members")
      .select("*", { count: "exact", head: true })
      .eq("group_id", grupo.id);

    const lotado = count >= grupo.max_membros;
    const participa = membro.length > 0;

    html += `
      <div class="grupo-card" data-id="${grupo.id}" data-tipo="${(grupo.tipo || 'semanal').toLowerCase()}">
        <b>${grupo.nome}</b><br>
        Valor: ${grupo.valor} Kz<br>
        <span id="membros-${grupo.id}">👥 ${count}/${grupo.max_membros}</span><br><br>

        ${
          lotado
            ? `<div style="color:red;font-weight:bold;">🔴 Grupo Lotado</div>`
            : participa
              ? `<div style="color:green;font-weight:bold;">✅ Já participa</div>
                 <button onclick="sairGrupo(${grupo.id})">Sair</button>`
              : `<button onclick="entrarGrupo(${grupo.id})">Entrar</button>`
        }
      </div>
    `;
  }

  document.getElementById("listaGrupos").innerHTML = html;
}

/* ENTRAR GRUPO */
async function entrarGrupo(groupId) {

  const limite = limitesPlano[planoAtual] || 0;

  if (gruposUsados >= limite) {
    return alert("❌ Limite do plano atingido");
  }

  const { data: existe } = await client
    .from("group_members")
    .select("*")
    .eq("group_id", groupId)
    .eq("user_id", currentUser.id);

  if (existe.length > 0) {
    return alert("Já fazes parte deste grupo");
  }

  const { error } = await client
    .from("group_members")
    .insert({ group_id: groupId, user_id: currentUser.id });

  if (error) return alert(error.message);

  gruposUsados++;

  await client
    .from("profiles")
    .update({ grupos_usados: gruposUsados })
    .eq("id", currentUser.id);

  await client.from("transactions").insert({
    user_id: currentUser.id,
    tipo: "entrada_grupo",
    valor: 0
  });

  document.getElementById("gruposUsados").innerText = gruposUsados;

  await carregarGrupos();
  alert("✔ Entraste no grupo!");
}

/* SAIR GRUPO */
async function sairGrupo(groupId) {

  const { error } = await client
    .from("group_members")
    .delete()
    .eq("group_id", groupId)
    .eq("user_id", currentUser.id);

  if (error) return alert(error.message);

  gruposUsados = Math.max(0, gruposUsados - 1);

  await client
    .from("profiles")
    .update({ grupos_usados: gruposUsados })
    .eq("id", currentUser.id);

  await client.from("transactions").insert({
    user_id: currentUser.id,
    tipo: "saida_grupo",
    valor: 0
  });

  document.getElementById("gruposUsados").innerText = gruposUsados;

  await carregarGrupos();
  alert("Saíste do grupo!");
}

/* HISTÓRICO */
async function carregarHistorico() {

  const { data } = await client
    .from("transactions")
    .select("*")
    .eq("user_id", currentUser.id)
    .order("created_at", { ascending: false });

  let html = "";

  for (const t of data) {
    let cor = "black";
    if (t.tipo === "deposito") cor = "green";
    if (t.tipo === "saida_grupo") cor = "red";

    html += `
      <div class="card">
        <b style="color:${cor}">${t.tipo}</b><br>
        ${t.valor} Kz<br>
        <small>${new Date(t.created_at).toLocaleString()}</small>
      </div>
    `;
  }

  document.getElementById("historico").innerHTML =
    html || "Nenhuma transação.";
}

/* SESSION */
async function verificarSessao() {

  try {
    const { data, error } = await client.auth.getSession();

    if (error) {
      console.log(error);
    }

    if (!data || !data.session) {
      document.getElementById("loginBox").style.display = "block";
      document.getElementById("app").style.display = "none";
      return;
    }

    currentUser = data.session.user;

    const { data: profile } = await client
      .from("profiles")
      .select("*")
      .eq("id", currentUser.id)
      .single();

    if (!profile) {
      alert("Perfil não encontrado no Supabase");
      return;
    }

    document.getElementById("loginBox").style.display = "none";
    document.getElementById("app").style.display = "block";

    document.getElementById("userEmail").innerText =
      "👤 " + (profile.nome || currentUser.email);

    document.getElementById("perfilNome").innerText =
      profile.nome || "Sem nome";

    document.getElementById("userSaldo").innerText =
      (profile.saldo || 0) + " Kz";

    planoAtual = profile.plano || "Basic";
    gruposUsados = profile.grupos_usados || 0;

    document.getElementById("planoAtual").innerText = planoAtual;
    document.getElementById("gruposUsados").innerText = gruposUsados;
    document.getElementById("gruposLimite").innerText =
      limitesPlano[planoAtual];

    await carregarGrupos();
    await carregarHistorico();

  } catch (err) {
    console.log("ERRO SESSÃO:", err);
    document.getElementById("loginBox").style.display = "block";
    document.getElementById("app").style.display = "none";
  }
                }

verificarSessao();
</script>
